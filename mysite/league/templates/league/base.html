{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Premier League Predictor{% endblock %}</title>

    <!-- Water.css (Dark Theme) for clean tables, forms, and typography -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">

    <style>
        /* Base page layout overrides */
        body { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 20px; 
        }

        /* Image sizing safeguards so badges don't overflow */
        img {
            max-width: 100%;
            height: auto;
        }

        .badge-img { 
            width: 32px !important; 
            height: 32px !important; 
            vertical-align: middle; 
            object-fit: contain; 
        }

        /* Table structural consistency */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        td, th {
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <!-- Universal Dynamic Navbar Component -->
    {% include 'league/navbar.html' %}

    <!-- Page Content Block -->
    <main style="margin-top: 20px;">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
