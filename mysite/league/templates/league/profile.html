{% extends 'league/base.html' %}
{% load static %}

{% block title %}My Profile | Premier League Predictor{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h2>⚙️ User Profile & Preferences</h2>

    {% if messages %}
        {% for message in messages %}
            <div style="padding: 10px; background-color: #10b981; color: white; border-radius: 4px; margin-bottom: 15px;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
        {% csrf_token %}

        <div>
            <label><strong>Username:</strong></label>
            <input type="text" value="{{ request.user.username }}" disabled style="width: 100%; opacity: 0.7;">
        </div>

        <div>
            <label for="favorite_team"><strong>Favorite Club:</strong></label>
            <select name="favorite_team" id="favorite_team" style="width: 100%; padding: 8px;">
                {% for team in teams %}
                    <option value="{{ team.id }}" {% if profile.favorite_team_id == team.id %}selected{% endif %}>
                        {{ team.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="password_hint"><strong>Password Recovery Hint (Optional):</strong></label>
            <input type="text" name="password_hint" id="password_hint" 
                   value="{{ profile.password_hint|default:'' }}" 
                   placeholder="e.g. Childhood pet's name" style="width: 100%;">
        </div>

        <button type="submit" style="padding: 10px; font-weight: bold; cursor: pointer;">
            Save Preferences
        </button>
    </form>
</div>
{% endblock %}
