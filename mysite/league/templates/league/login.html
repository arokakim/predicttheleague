{% extends 'league/base.html' %}

{% block title %}Login - Match Predictor{% endblock %}

{% block content %}
<div style="max-width: 350px; margin: 40px auto; padding: 25px; border: 1px solid #3f445b; border-radius: 10px; background-color: #1e2130;">
    <h2 style="text-align: center; margin-bottom: 20px;">Login</h2>

    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Username</label>
            <input type="text" name="username" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #3f445b;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px;">Password</label>
            <input type="password" name="password" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #3f445b;">
        </div>

        <button type="submit" style="width: 100%; padding: 10px; font-weight: bold; cursor: pointer;">Log In</button>
    </form>
</div>
{% endblock %}
